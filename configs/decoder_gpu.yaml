# ShinkaEvolve config -- self-hosted GPU path (vLLM or SGLang).
#
#   bash setup/serve_vllm.sh                       # terminal 1
#   run_evolution.py --endpoint local \
#       --base-url http://localhost:8000/v1 \
#       --model Qwen/Qwen3.5-9B    # terminal 2
#
# Inference is free here -- you are already paying for the GPU by the minute --
# so the budget is wall-clock and generations rather than dollars. That changes
# the economics: run more generations, sample at higher temperature, and let
# the search explore. The thing you are spending is GPU time, and an idle GPU
# costs exactly as much as a busy one.

# Raised relative to the gateway config: a local server has no per-request
# billing and no vendor rate limit, so keep the GPU busy. If proposals start
# timing out, lower max_proposal_jobs before anything else -- you are queueing
# more concurrent sequences than the server's KV cache can hold.
max_evaluation_jobs: 4
max_proposal_jobs: 4
max_db_workers: 2

db_config:
  # Two islands: free inference makes longer runs practical, and at that length
  # island separation is worth having to stop one lineage taking over.
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 2
  num_top_k_inspirations: 1
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10
  archive_selection_strategy: "crowding"
  island_selection_strategy: equal
  archive_criteria:
    combined_score: 1.0
    loc: -0.3

evo_config:
  patch_types: [diff, full, cross]
  # Weighted toward full rewrites relative to the gateway config. Smaller
  # open-weight models are markedly worse at emitting an exactly-matching
  # SEARCH/REPLACE block than they are at rewriting a function wholesale, and a
  # diff that does not apply is a wasted generation.
  patch_type_probs: [0.45, 0.45, 0.1]

  num_generations: 40

  # No spend to cap. Left null deliberately: the GPU is the cost, so stop the
  # run on generations or by hand, not on a dollar figure that never moves.
  max_api_costs: null

  max_patch_resamples: 3
  max_patch_attempts: 2
  max_novelty_attempts: 1

  job_type: local
  language: python

  # Overwritten by run_evolution.py from --model/--base-url.
  llm_models:
    - "local/Qwen/Qwen3.5-9B@http://localhost:8000/v1"

  llm_dynamic_selection: ucb1
  llm_dynamic_selection_kwargs:
    exploration_coef: 1.0
    # No cost signal to be aware of when inference is free.
    cost_aware_coef: 0.0

  llm_kwargs:
    temperatures: [0.6, 0.8, 1.0]
    reasoning_efforts: ["medium"]
    # Local context is whatever you started the server with (--max-model-len /
    # --context-length). Keep this well under it: the prompt carries the seed
    # program, inspirations and feedback, and an overflow is a hard failure.
    max_tokens: 8192

  meta_rec_interval: null
  meta_llm_models: null
  embedding_model: null
  novelty_llm_models: null
  evolve_prompts: false

  use_text_feedback: true

  init_program_path: task_decoder/initial.py
  results_dir: results/decoder
